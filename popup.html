<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaUnfollow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <h1>InstaUnfollow</h1>
                <span class="badge" id="version-badge">v1.2</span>
            </div>
            <p id="status">Pronto para escanear</p>
            <div class="meta-row">
                <span id="last-scan-info" class="meta-info hidden"></span>
                <button id="clear-data-btn" class="text-btn hidden" title="Limpar histórico de escaneamento">Limpar dados</button>
            </div>
        </header>

        <main>
            <div class="actions">
                <button id="scan-btn" class="primary-btn">Escanear Seguidores</button>
                
                <div class="bulk-actions hidden" id="bulk-actions">
                    <button id="unfollow-all-btn" class="danger-btn" title="Remover apenas contas não protegidas">Remover Pendentes</button>
                    <button id="cancel-unfollow-btn" class="secondary-btn hidden">Parar</button>
                    <button id="export-btn" class="secondary-btn" title="Exportar lista como CSV">Exportar CSV</button>
                </div>
            </div>

            <div id="progress-container" class="hidden">
                <div class="progress-bar">
                    <div id="progress-fill"></div>
                </div>
                <p id="progress-text">0%</p>
            </div>

            <div id="results-container" class="hidden">
                <div class="results-header">
                    <div class="results-title-row">
                        <h2>Não te seguem (<span id="count">0</span>)</h2>
                        <div class="filter-pills">
                            <button id="filter-all" class="pill active" data-filter="all">Todos</button>
                            <button id="filter-unprotected" class="pill" data-filter="unprotected">Sem proteção</button>
                            <button id="filter-whitelist" class="pill" data-filter="whitelist">⭐ Protegidos (<span id="whitelist-count">0</span>)</button>
                        </div>
                    </div>
                    <input type="search" id="search-input" placeholder="Buscar por usuário..." aria-label="Filtrar não seguidores">
                </div>
                <p id="no-search-results" class="empty-msg hidden">Nenhum usuário encontrado.</p>
                <ul id="user-list" role="list">
                    <!-- Usuários aparecerão aqui -->
                </ul>
            </div>

            <div id="login-msg" class="hidden">
                <p>Por favor, faça login na sua conta do Instagram para escanear.</p>
                <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="link-btn">Abrir Instagram</a>
            </div>
        </main>

        <footer>
            <p>Use com moderação para respeitar os limites do Instagram.</p>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
